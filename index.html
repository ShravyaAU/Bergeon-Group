<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bergeon Group | Screen Intake</title>
    <!-- Add HTML5 Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --asu-gold: #FFC627;
            --black: #000000;
            --cream: #FDFCE9;
            --white: #FFFFFF;
            --gray: #E0E0E0;
            --dark-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--cream);
            color: var(--black);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: var(--white);
            border-right: 2px solid var(--black);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo-area {
            background-color: var(--asu-gold);
            padding: 20px;
            border-bottom: 2px solid var(--black);
            display: flex;
            align-items: center;
            gap: 10px;
            height: 80px;
        }

        .logo-area svg {
            width: 24px;
            height: 24px;
        }

        .logo-area h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .nav-links {
            flex: 1;
            padding: 20px 0;
        }

        .nav-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 1px solid var(--gray);
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: var(--cream);
        }

        .nav-item.active {
            background-color: var(--black);
            color: var(--white);
            border-bottom: 1px solid var(--black);
        }

        .nav-item.active svg {
            fill: var(--white);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: var(--black);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            height: 80px;
            background-color: var(--white);
            border-bottom: 2px solid var(--black);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .topbar h2 {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Dashboard Grid */
        .dashboard-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .intake-panel {
            width: 400px;
            border-right: 2px solid var(--black);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: var(--cream);
        }

        .log-panel {
            flex: 1;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
        }

        /* Intake Components */
        .section-header {
            background-color: var(--black);
            color: var(--white);
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scanner-container {
            padding: 20px;
            border-bottom: 2px solid var(--black);
        }

        /* html5-qrcode overrides to match your theme */
        #reader {
            width: 100%;
            border: 2px solid var(--black) !important;
            background-color: var(--white);
            margin-bottom: 15px;
        }
        
        #reader button {
            background-color: var(--black);
            color: var(--white);
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        
        #reader select {
            border: 2px solid var(--black);
            padding: 5px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .barcode-input-wrapper {
            display: flex;
        }

        .barcode-input-wrapper input {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--black);
            border-right: none;
            font-size: 1rem;
            font-family: monospace;
            background-color: var(--white);
            outline: none;
        }

        .barcode-input-wrapper button {
            background-color: var(--black);
            color: var(--white);
            border: 2px solid var(--black);
            padding: 0 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Form Area */
        .form-container {
            padding: 20px;
            flex: 1;
        }

        .status-display {
            background-color: var(--white);
            border: 2px solid var(--black);
            padding: 10px;
            font-family: monospace;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #666;
        }

        .status-display.active {
            background-color: var(--asu-gold);
            color: var(--black);
            font-weight: bold;
        }

        .toggle-group {
            display: flex;
            border: 2px solid var(--black);
            margin-bottom: 20px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: var(--white);
            font-weight: 700;
            cursor: pointer;
            border-right: 2px solid var(--black);
        }

        .toggle-btn:last-child {
            border-right: none;
        }

        .toggle-btn.selected {
            background-color: var(--asu-gold);
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--black);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            background-color: var(--white);
            outline: none;
            cursor: pointer;
        }

        .star-rating {
            display: flex;
            border: 2px solid var(--black);
            background: var(--white);
            margin-bottom: 30px;
        }

        .star-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: none;
            border-right: 2px solid var(--black);
            cursor: pointer;
            font-size: 1.2rem;
            color: #d9d9d9;
        }

        .star-btn:last-child {
            border-right: none;
        }

        .star-btn.active {
            color: var(--black);
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--gray);
            color: #666;
            border: 2px solid var(--black);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: all 0.2s;
        }

        .action-btn.ready {
            background-color: var(--black);
            color: var(--white);
            cursor: pointer;
        }

        .action-btn.ready:hover {
            background-color: var(--asu-gold);
            color: var(--black);
        }

        /* Log Panel */
        .log-table-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            fill: #d9d9d9;
            margin-bottom: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            display: none;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--black);
            padding: 12px;
            text-align: left;
        }

        .data-table th {
            background-color: var(--cream);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .data-table td {
            font-size: 0.9rem;
            font-family: monospace;
        }

        .badge {
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            background-color: var(--asu-gold);
            color: var(--black);
            border: 1px solid var(--black);
        }

        .badge.burn {
            background-color: var(--black);
            color: var(--white);
        }

        .table-footer {
            height: 40px;
            border-top: 2px solid var(--black);
            background-color: var(--cream);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.88-11.71L10 14.17l-1.88-1.88a.996.996 0 1 0-1.41 1.41l2.59 2.59c.39.39 1.02.39 1.41 0L17.3 9.7a.996.996 0 0 0-1.42-1.41z"/></svg>
            <h1>BERGEON</h1>
        </div>
        <nav class="nav-links">
            <div class="nav-item active">
                INTAKE DASHBOARD
            </div>
            <div class="nav-item">
                SCREEN INVENTORY
            </div>
            <div class="nav-item">
                EMULSION LOGS
            </div>
            <div class="nav-item">
                INVOICING
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2>Screen Processing Intake</h2>
        </header>

        <div class="dashboard-container">
            <div class="intake-panel">
                <div class="scanner-container">
                    <!-- Actual Camera Scanner Div -->
                    <div id="reader"></div>
                    
                    <div class="input-group">
                        <label>Manual Fallback Input</label>
                        <div class="barcode-input-wrapper">
                            <input type="text" id="manualBarcode" placeholder="Enter barcode manually...">
                            <button onclick="handleManualEntry()">ENTER</button>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <span>Processing Details</span>
                    <span id="priceDisplay" style="color: var(--asu-gold);">$0.00</span>
                </div>

                <div class="form-container">
                    <div class="input-group">
                        <label>Linked Barcode</label>
                        <div class="status-display" id="barcodeDisplay">Awaiting scan...</div>
                    </div>

                    <div class="input-group">
                        <label>Service Type</label>
                        <div class="toggle-group">
                            <button class="toggle-btn selected" id="btnReclaim" onclick="setService('reclaim')">RECLAIM</button>
                            <button class="toggle-btn" id="btnBurn" onclick="setService('burn')">BURN</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Emulsion Type</label>
                        <select id="emulsionSelect" disabled>
                            <option value="dual-cure">DUAL CURE</option>
                            <option value="diazo">DIAZO</option>
                            <option value="photopolymer">PHOTOPOLYMER</option>
                            <option value="capillary-film">CAPILLARY FILM</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label style="display: flex; justify-content: space-between;">
                            <span>Difficulty Rating</span>
                            <span style="font-weight: normal; color: #666;">1=Easy, 5=Hard</span>
                        </label>
                        <div class="star-rating">
                            <button class="star-btn active" onclick="setRating(1)">★</button>
                            <button class="star-btn" onclick="setRating(2)">★</button>
                            <button class="star-btn" onclick="setRating(3)">★</button>
                            <button class="star-btn" onclick="setRating(4)">★</button>
                            <button class="star-btn" onclick="setRating(5)">★</button>
                        </div>
                    </div>

                    <button class="action-btn" id="submitBtn" onclick="submitLog()">AWAITING SCAN...</button>
                </div>
            </div>

            <div class="log-panel">
                <div class="log-table-container">
                    <div class="empty-state" id="emptyState">
                        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                        <h3>No screens processed this shift.</h3>
                    </div>
                    <table class="data-table" id="logTable">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Barcode ID</th>
                                <th>Service</th>
                                <th>Emulsion</th>
                                <th>Difficulty</th>
                                <th>Est. Cost</th>
                            </tr>
                        </thead>
                        <tbody id="logBody">
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <span id="recordCount">0 RECORDS</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentBarcode = null;
        let currentService = 'reclaim';
        let currentRating = 1;
        let recordCount = 0;
        const basePrices = { reclaim: 10, burn: 50 };
        const difficultyMultipliers = [1, 1.2, 1.5, 1.8, 2];

        // Initialize Live Camera Scanner
        function onScanSuccess(decodedText, decodedResult) {
            // Beep to confirm scan
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 800Hz beep
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);

            processBarcode(decodedText);
        }

        function onScanFailure(error) {
            // Ignore ongoing scan failures as it constantly reads until it finds one
        }

        // Render the scanner when the page loads
        document.addEventListener("DOMContentLoaded", function() {
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: {width: 250, height: 100} },
                /* verbose= */ false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });

        // The rest of the logic remains the same
        function handleManualEntry() {
            const input = document.getElementById('manualBarcode').value;
            if (input.length > 0) { 
                processBarcode(input);
                document.getElementById('manualBarcode').value = '';
            }
        }

        function processBarcode(code) {
            currentBarcode = code;
            const display = document.getElementById('barcodeDisplay');
            display.textContent = code;
            display.classList.add('active');
            
            document.getElementById('emulsionSelect').disabled = false;
            
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'LOG SCREEN TO DATABASE';
            btn.classList.add('ready');

            updatePrice();
        }

        function setService(type) {
            currentService = type;
            if(type === 'reclaim') {
                document.getElementById('btnReclaim').classList.add('selected');
                document.getElementById('btnBurn').classList.remove('selected');
            } else {
                document.getElementById('btnBurn').classList.add('selected');
                document.getElementById('btnReclaim').classList.remove('selected');
            }
            updatePrice();
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star-btn');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
            updatePrice();
        }

        function updatePrice() {
            if(!currentBarcode) return;
            const base = basePrices[currentService];
            const multiplier = difficultyMultipliers[currentRating - 1];
            const finalPrice = (base * multiplier).toFixed(2);
            document.getElementById('priceDisplay').textContent = `$${finalPrice}`;
        }

        async function submitLog() {
            if (!currentBarcode) return;

            // Change btn text to show loading state
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'SAVING TO DATABASE...';
    
            const emulsion = document.getElementById('emulsionSelect').options[document.getElementById('emulsionSelect').selectedIndex].text;
            const priceText = document.getElementById('priceDisplay').textContent;
            const rawPrice = parseFloat(priceText.replace('$', '')); // Remove the $ for the database

            const payload = {
                barcode: currentBarcode,
                service_type: currentService,
                emulsion_type: emulsion,
                difficulty_rating: currentRating,
                estimated_cost: rawPrice
            };

            try {
                // Replace with your live Render URL once deployed
                const response = await fetch('https://bergeon-group.onrender.com/api/intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if(response.ok) {
                    // Un-hide the table if it's the first scan
                    document.getElementById('emptyState').style.display = 'none';
                    document.getElementById('logTable').style.display = 'table';

                    // Generate Timestamp for the UI table
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            
                    const serviceBadgeClass = currentService === 'burn' ? 'badge burn' : 'badge';
                    const tbody = document.getElementById('logBody');
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${timeString}</td>
                        <td><strong>${currentBarcode}</strong></td>
                        <td><span class="${serviceBadgeClass}">${currentService.toUpperCase()}</span></td>
                        <td>${emulsion}</td>
                        <td>${'★'.repeat(currentRating)}</td>
                        <td>$${rawPrice.toFixed(2)}</td>
                    `;

                    // Insert new row at the top of the table
                    tbody.insertBefore(row, tbody.firstChild);

                    recordCount++;
                    document.getElementById('recordCount').textContent = `${recordCount} RECORD${recordCount !== 1 ? 'S' : ''}`;

                    resetForm();
                } else {
                    alert("Database Error: " + result.detail);
                    btn.textContent = 'LOG SCREEN TO DATABASE'; // Reset button on failure
                }
            } catch (error) {
                alert("Failed to connect to the backend API.");
                btn.textContent = 'LOG SCREEN TO DATABASE';
            }
        }

        function resetForm() {
            currentBarcode = null;
            currentRating = 1;
            
            const display = document.getElementById('barcodeDisplay');
            display.textContent = 'Awaiting scan...';
            display.classList.remove('active');
            
            document.getElementById('emulsionSelect').disabled = true;
            document.getElementById('priceDisplay').textContent = '$0.00';
            
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'AWAITING SCAN...';
            btn.classList.remove('ready');

            setRating(1);
        }
    </script>
</body>
</html>
