<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bergeon Group | Screen Tracker</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --asu-gold: #FFC627; --black: #000000; --cream: #FDFCE9; 
            --white: #FFFFFF; --gray: #E0E0E0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', sans-serif; }
        body { background-color: var(--cream); color: var(--black); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 250px; background-color: var(--white); border-right: 2px solid var(--black); display: flex; flex-direction: column; z-index: 10; }
        .logo-area { background-color: var(--asu-gold); padding: 20px; border-bottom: 2px solid var(--black); display: flex; align-items: center; gap: 10px; height: 80px; }
        .logo-area h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .nav-links { flex: 1; padding: 20px 0; overflow-y: auto; }
        .nav-item { padding: 15px 20px; font-weight: 600; border-bottom: 1px solid var(--gray); cursor: pointer; }
        .nav-item.active { background-color: var(--black); color: var(--white); border-bottom: 1px solid var(--black); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { height: 80px; background-color: var(--white); border-bottom: 2px solid var(--black); display: flex; align-items: center; padding: 0 30px; flex-shrink: 0; }
        .topbar h2 { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }

        .dashboard-container { display: flex; flex: 1; overflow: hidden; }
        .intake-panel { width: 400px; border-right: 2px solid var(--black); display: flex; flex-direction: column; overflow-y: auto; background-color: var(--cream); flex-shrink: 0; }
        .log-panel { flex: 1; background-color: var(--white); display: flex; flex-direction: column; overflow: hidden; }

        .section-header { background-color: var(--black); color: var(--white); padding: 10px 15px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; display: flex; justify-content: space-between; }
        .scanner-container { padding: 20px; border-bottom: 2px solid var(--black); }
        
        #reader { width: 100%; border: 2px solid var(--black); background-color: var(--black); margin-bottom: 15px; border-radius: 0; display: none; position: relative; }
        #reader video { object-fit: cover; width: 100%; height: auto; }
        #reader canvas.drawingBuffer { position: absolute; top: 0; left: 0; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        
        .text-input, select { width: 100%; padding: 10px; border: 2px solid var(--black); font-size: 1rem; background-color: var(--white); outline: none; }
        .barcode-input-wrapper { display: flex; }
        .barcode-input-wrapper input { flex: 1; border-right: none; font-family: monospace; }
        .barcode-input-wrapper button { background-color: var(--black); color: var(--white); border: 2px solid var(--black); padding: 0 15px; font-weight: 700; cursor: pointer; }

        .form-container { padding: 20px; flex: 1; }
        .status-display { background-color: var(--white); border: 2px solid var(--black); padding: 10px; font-family: monospace; font-size: 1.1rem; margin-bottom: 20px; text-align: center; }
        .status-display.active { background-color: var(--asu-gold); color: var(--black); font-weight: bold; }

        .toggle-group { display: flex; border: 2px solid var(--black); margin-bottom: 20px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: var(--white); font-weight: 700; cursor: pointer; border-right: 2px solid var(--black); }
        .toggle-btn:last-child { border-right: none; }
        .toggle-btn.selected { background-color: var(--asu-gold); }

        .star-rating { display: flex; border: 2px solid var(--black); background: var(--white); margin-bottom: 30px; }
        .star-btn { flex: 1; padding: 10px 0; border: none; background: none; border-right: 2px solid var(--black); cursor: pointer; font-size: 1.2rem; color: #d9d9d9; }
        .star-btn:last-child { border-right: none; }
        .star-btn.active { color: var(--black); }

        .action-btn { width: 100%; padding: 15px; background-color: var(--gray); color: #666; border: 2px solid var(--black); font-size: 1rem; font-weight: 800; cursor: not-allowed; }
        .action-btn.ready { background-color: var(--black); color: var(--white); cursor: pointer; }
        .camera-start-btn { width: 100%; padding: 20px; margin-bottom: 15px; background-color: var(--black); color: var(--white); border: 2px solid var(--black); font-size: 1.1rem; font-weight: 800; cursor: pointer; }

        .log-table-container { flex: 1; overflow-y: auto; padding: 20px; }
        .empty-state { height: 100%; display: flex; justify-content: center; align-items: center; color: #999; }
        .data-table { width: 100%; border-collapse: collapse; display: none; }
        .data-table th, .data-table td { border: 1px solid var(--black); padding: 12px; text-align: left; }
        .data-table th { background-color: var(--cream); font-size: 0.8rem; text-transform: uppercase; }
        .badge { padding: 4px 8px; font-size: 0.75rem; font-weight: 700; background-color: var(--asu-gold); color: var(--black); border: 1px solid var(--black); }
        .badge.return { background-color: var(--black); color: var(--white); }

        .processing-fields { transition: opacity 0.2s; }
        .processing-fields.hidden { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; min-height: 100vh; }
            .sidebar { width: 100%; flex-direction: row; height: 60px; border-right: none; border-bottom: 2px solid var(--black); flex-shrink: 0; }
            .logo-area { height: 60px; border-bottom: none; border-right: 2px solid var(--black); padding: 10px; }
            .nav-links { display: none; }
            .main-content { overflow: visible; height: auto; flex: none; }
            .topbar { display: none; } 
            .dashboard-container { flex-direction: column; overflow: visible; height: auto; }
            .intake-panel { width: 100%; border-right: none; border-bottom: 2px solid var(--black); overflow-y: visible; height: auto; }
            .log-panel { overflow: visible; height: auto; flex: none; padding-bottom: 40px; }
            .log-table-container { overflow-x: auto; overflow-y: visible; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area"><h1>BERGEON</h1></div>
        <nav class="nav-links"><div class="nav-item active">TRACKING DASHBOARD</div></nav>
    </aside>

    <main class="main-content">
        <header class="topbar"><h2>Screen Tracking</h2></header>
        <div class="dashboard-container">
            
            <div class="intake-panel">
                <div class="scanner-container" id="topOfPage">
                    <!-- New Button to manually trigger camera permission -->
                    <button id="startCameraBtn" class="camera-start-btn" onclick="startCamera()">📷 TAP TO START CAMERA</button>
                    
                    <div id="reader"></div>
                    
                    <div class="input-group">
                        <label>Manual Fallback Input</label>
                        <div class="barcode-input-wrapper">
                            <input type="text" id="manualBarcode" class="text-input" placeholder="Enter barcode manually...">
                            <button onclick="handleManualEntry()">ENTER</button>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <span>Workflow Details</span>
                </div>

                <div class="form-container" id="mainFormContainer">
                    <div class="input-group">
                        <label>Technician Name</label>
                        <input type="text" id="techName" class="text-input" placeholder="e.g., John Doe">
                    </div>

                    <div class="input-group">
                        <label>Action Type</label>
                        <div class="toggle-group">
                            <button class="toggle-btn selected" id="btnIntake" onclick="setActionType('INTAKE')">PICKUP (INTAKE)</button>
                            <button class="toggle-btn" id="btnReturn" onclick="setActionType('RETURN')">DISPATCH (RETURN)</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Linked Barcode</label>
                        <div class="status-display" id="barcodeDisplay">Ready to scan...</div>
                    </div>

                    <div id="processingFields" class="processing-fields">
                        <div class="input-group">
                            <label>Service Type</label>
                            <div class="toggle-group">
                                <button class="toggle-btn selected" id="btnReclaim" onclick="setService('reclaim')">RECLAIM</button>
                                <button class="toggle-btn" id="btnBurn" onclick="setService('burn')">BURN</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Emulsion Type</label>
                            <select id="emulsionSelect" class="text-input" disabled>
                                <option value="dual-cure">DUAL CURE</option>
                                <option value="diazo">DIAZO</option>
                                <option value="capillary-film">CAPILLARY FILM</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Difficulty Rating (1=Easy, 5=Hard)</label>
                            <div class="star-rating">
                                <button class="star-btn active" onclick="setRating(1)">★</button>
                                <button class="star-btn" onclick="setRating(2)">★</button>
                                <button class="star-btn" onclick="setRating(3)">★</button>
                                <button class="star-btn" onclick="setRating(4)">★</button>
                                <button class="star-btn" onclick="setRating(5)">★</button>
                            </div>
                        </div>
                    </div>

                    <button class="action-btn" id="submitBtn" onclick="submitLog()">AWAITING SCAN...</button>
                </div>
            </div>

            <div class="log-panel">
                <div class="log-table-container">
                    <div class="empty-state" id="emptyState"><h3>Loading data...</h3></div>
                    <table class="data-table" id="logTable">
                        <thead>
                            <tr>
                                <th>Date & Time</th>
                                <th>Action</th>
                                <th>Tech</th>
                                <th>Barcode</th>
                            </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentBarcode = null;
        let currentAction = 'INTAKE';
        let currentService = 'reclaim';
        let currentRating = 1;
        let isScannerLocked = false;
        let html5QrCode = null;
        let isCameraRunning = false; 

        document.addEventListener("DOMContentLoaded", () => {
            fetchLogs();
            // initScanner() is deliberately removed here so it waits for the button tap
        });

        function formatDateTime(dateString) {
            const dateObj = typeof dateString === 'string' ? new Date(dateString + 'Z') : dateString;
            return dateObj.toLocaleString('en-US', {
                month: 'short', day: 'numeric', 
                hour: 'numeric', minute: '2-digit'
            });
        }

        async function fetchLogs() {
            try {
                const response = await fetch('https://bergeon-group.onrender.com/api/logs');
                const data = await response.json();
                
                if (data.logs.length > 0) {
                    document.getElementById('emptyState').style.display = 'none';
                    document.getElementById('logTable').style.display = 'table';
                    const tbody = document.getElementById('logBody');
                    tbody.innerHTML = ''; 
                    
                    data.logs.forEach(log => {
                        const badgeClass = log.action_type === 'RETURN' ? 'badge return' : 'badge';
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${formatDateTime(log.scanned_at)}</td>
                            <td><span class="${badgeClass}">${log.action_type}</span></td>
                            <td>${log.technician_name}</td>
                            <td><strong>${log.barcode}</strong></td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    document.getElementById('emptyState').innerHTML = '<h3>No records found.</h3>';
                }
            } catch (err) {
                document.getElementById('emptyState').innerHTML = '<h3>Failed to load database logs.</h3>';
            }
        }

        async function startCamera() {
            // Check if browser supports getUserMedia
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('reader').innerHTML = '<p style="color:white; padding:20px; text-align:center;">Browser not supported. Please use Chrome, Firefox, or Safari.</p>';
                document.getElementById('reader').style.display = 'block';
                document.getElementById('startCameraBtn').style.display = 'none';
                return;
            }

            // Request camera permission first
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                // Stop the test stream immediately
                stream.getTracks().forEach(track => track.stop());
                
                // Hide the button and show the video feed box
                document.getElementById('startCameraBtn').style.display = 'none';
                document.getElementById('reader').style.display = 'block';
                initScanner();
            } catch (err) {
                console.error("Permission error:", err);
                document.getElementById('reader').innerHTML = `
                    <p style="color:white; padding:20px; text-align:center; font-size:14px;">
                        Camera permission denied.<br><br>
                        Please allow camera access in your browser settings<br>
                        and refresh the page to try again.
                    </p>`;
                document.getElementById('reader').style.display = 'block';
                document.getElementById('startCameraBtn').style.display = 'none';
            }
        }

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            
            const cameraConfig = { 
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            };

            html5QrCode.start(
                cameraConfig, 
                { 
                    fps: 10, // A stable frame rate gives the decoder time to process the image
                    // Explicitly tell the scanner to look for standard 1D barcode formats
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.ITF
                    ]
                    // Removed the qrbox: It will now scan the entire screen for barcodes
                    // Removed experimental native detector: Relies on the stable web-decoder instead
                },
                (decodedText) => { 
                    // Lowered the filter to 4 characters so it catches shorter valid barcodes
                    if (decodedText.trim().length < 4) return;
                    
                    console.log("Scanned:", decodedText);
                    if (!isScannerLocked) onScanSuccess(decodedText.trim()); 
                },
                (errorMessage) => {
                    // Silently ignore frames without barcodes
                }
            ).then(() => {
                isCameraRunning = true;
                console.log("Camera started successfully");
            }).catch(err => {
                console.error("Camera error:", err);
                document.getElementById('reader').innerHTML = `
                    <p style="color:white; padding:20px; text-align:center; font-size:14px;">
                        Camera error: ${err?.message || err}<br><br>
                        Please check camera permissions and refresh.
                    </p>`;
                isCameraRunning = false;
            });
        }

        function onScanSuccess(decodedText) {
            isScannerLocked = true; 
            processBarcode(decodedText);
        }

        function handleManualEntry() {
            const input = document.getElementById('manualBarcode').value.trim();
            if (input.length > 0) { 
                isScannerLocked = true;
                processBarcode(input);
                document.getElementById('manualBarcode').value = '';
            }
        }

        function processBarcode(code) {
            currentBarcode = code;
            const display = document.getElementById('barcodeDisplay');
            display.textContent = code;
            display.classList.add('active');
            
            if(currentAction === 'INTAKE') document.getElementById('emulsionSelect').disabled = false;
            
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'LOG SCREEN TO DATABASE';
            btn.classList.add('ready');

            if(window.innerWidth <= 768) {
                setTimeout(() => {
                    document.getElementById('techName').scrollIntoView({behavior: "smooth", block: "start"});
                }, 100);
            }
        }

        function setActionType(type) {
            currentAction = type;
            const btnIntake = document.getElementById('btnIntake');
            const btnReturn = document.getElementById('btnReturn');
            const procFields = document.getElementById('processingFields');

            if(type === 'INTAKE') {
                btnIntake.classList.add('selected');
                btnReturn.classList.remove('selected');
                procFields.classList.remove('hidden');
                document.getElementById('emulsionSelect').disabled = !currentBarcode;
            } else {
                btnReturn.classList.add('selected');
                btnIntake.classList.remove('selected');
                procFields.classList.add('hidden');
            }
        }

        function setService(type) {
            currentService = type;
            if(type === 'reclaim') {
                document.getElementById('btnReclaim').classList.add('selected');
                document.getElementById('btnBurn').classList.remove('selected');
            } else {
                document.getElementById('btnBurn').classList.add('selected');
                document.getElementById('btnReclaim').classList.remove('selected');
            }
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star-btn');
            stars.forEach((star, index) => {
                if (index < rating) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        async function submitLog() {
            if (!currentBarcode) return;
            
            const techName = document.getElementById('techName').value.trim() || 'Unknown';
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'SAVING...';
            
            let emulsion = 'N/A';
            let rating = 0;
            let service = 'none';

            if (currentAction === 'INTAKE') {
                emulsion = document.getElementById('emulsionSelect').options[document.getElementById('emulsionSelect').selectedIndex].text;
                rating = currentRating;
                service = currentService;
            }

            const payload = {
                barcode: currentBarcode,
                technician_name: techName,
                action_type: currentAction,
                service_type: service,
                emulsion_type: emulsion,
                difficulty_rating: rating,
                estimated_cost: 0.0
            };

            try {
                const response = await fetch('https://bergeon-group.onrender.com/api/intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(response.ok) {
                    fetchLogs();
                    resetForm();
                } else {
                    alert("Database Error");
                    btn.textContent = 'LOG SCREEN TO DATABASE';
                }
            } catch (error) {
                alert("Failed to connect to backend.");
                btn.textContent = 'LOG SCREEN TO DATABASE';
            }
        }

        async function resetForm() {
            currentBarcode = null;
            currentRating = 1;
            
            document.getElementById('barcodeDisplay').textContent = 'Ready to scan...';
            document.getElementById('barcodeDisplay').classList.remove('active');
            
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'AWAITING SCAN...';
            btn.classList.remove('ready');

            setRating(1);
            isScannerLocked = false;

            // Stop and restart scanner for continuous scanning
            if (html5QrCode && isCameraRunning) {
                try {
                    await html5QrCode.stop();
                    isCameraRunning = false;
                    // Restart the scanner after a short delay
                    setTimeout(() => {
                        initScanner();
                    }, 500);
                } catch (err) {
                    console.error("Error restarting scanner:", err);
                }
            }
            
            if(window.innerWidth <= 768) {
                window.scrollTo({top: 0, behavior: 'instant'});
            }
        }
    </script>
</body>
</html>
